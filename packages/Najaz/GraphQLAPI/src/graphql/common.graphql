input CitizenLoginInput {
    nationalId: String @rename(attribute: "national_id")
    email: String
    password: String!
    remember: Boolean
    deviceToken: String @rename(attribute: "device_token")
}

type CitizenLoginResponse {
    success: Boolean
    message: String
    accessToken: String @rename(attribute: "access_token")
    tokenType: String @rename(attribute: "token_type")
    expiresIn: Int @rename(attribute: "expires_in")
    citizen: Citizen
    services: [Service]
}

type Service {
    id: ID!
    serviceNumber: String! @rename(attribute: "service_number")
    name: String! @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\ServiceResolver@name")
    description: String @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\ServiceResolver@description")
    status: Boolean
    image: String
    sortOrder: Int @rename(attribute: "sort_order")
}

type ServiceImage {
    id: ID!
    type: String
    path: String!
    url: String!
    position: Int!
    serviceId: Int! @rename(attribute: "service_id")
}

type ServiceAttributeGroup {
    id: ID!
    code: String!
    defaultName: String @rename(attribute: "default_name")
    groupType: String @rename(attribute: "group_type")
    sortOrder: Int @rename(attribute: "sort_order")
    name: String
    description: String
    fields: [ServiceAttributeField!]!
}

type ServiceAttributeField {
    id: ID!
    code: String!
    type: String!
    label: String
    validationRules: JSON @rename(attribute: "validation_rules")
    defaultValue: String @rename(attribute: "default_value")
    isRequired: Boolean @rename(attribute: "is_required")
    sortOrder: Int @rename(attribute: "sort_order")
    attributeType: ServiceAttributeType @belongsTo(relation: "attributeType")
}

type ServiceAttributeType {
    id: ID!
    code: String!
    type: String!
    name: String
    isUserDefined: Boolean @rename(attribute: "is_user_defined")
    isRequired: Boolean @rename(attribute: "is_required")
    isUnique: Boolean @rename(attribute: "is_unique")
    position: Int
    validation: String
    regex: String
    defaultValue: String @rename(attribute: "default_value")
    defaultName: String @rename(attribute: "default_name")
    options: [ServiceAttributeTypeOption!]!
}

type ServiceAttributeTypeOption {
    id: ID!
    adminName: String @rename(attribute: "admin_name")
    label: String
    sortOrder: Int @rename(attribute: "sort_order")
}

"""
High-level form description for a service, tailored for citizen apps.
"""
type ServiceForm {
    groups: [ServiceFormGroup!]!
}

"""
Logical section in a service form (e.g. husband_data, wife_data, attachments).
"""
type ServiceFormGroup {
    code: String!
    label: String!
    description: String
    sortOrder: Int
    pivotUid: String
    isNotifiable: Boolean
    customCode: String
    customName: String
    fields: [ServiceFormField!]!
}

"""
Single input field within a service form group.
"""
type ServiceFormField {
    code: String!
    label: String!
    type: String!
    isRequired: Boolean!
    defaultValue: String
    validationRules: JSON
    sortOrder: Int
    options: [ServiceFormFieldOption!]
}

"""
Selectable option for fields like select/radio.
"""
type ServiceFormFieldOption {
    value: String!
    label: String!
}

extend type Service {
    """
    High-level form definition for this service, derived from attribute groups,
    fields, types and options.
    """
    form: ServiceForm @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\ServiceFormQuery@form")
    
    """
    All images for this service.
    """
    images: [ServiceImage!]! @hasMany
    
    """
    Base image (first image) for this service.
    """
    baseImage: String @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\ServiceResolver@baseImage")
    
    """
    Category that this service belongs to.
    """
    category: ServiceCategory @belongsTo
}

# Base Citizen type definition
type Citizen {
    id: ID!
    firstName: String! @rename(attribute: "first_name")
    middleName: String! @rename(attribute: "middle_name")
    lastName: String! @rename(attribute: "last_name")
    gender: String
    email: String
    phone: String
    nationalId: String @rename(attribute: "national_id")
    dateOfBirth: String @rename(attribute: "date_of_birth")
    status: Boolean
    isVerified: Boolean @rename(attribute: "is_verified")
    identityVerificationStatus: Boolean @rename(attribute: "identity_verification_status")
    citizenTypeName: String @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\CitizenQuery@citizenTypeName")
    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
    identityVerification: IdentityVerification @hasOne(relation: "identityVerification")
}

# Citizen response type
type CitizenResponse {
    success: Boolean
    message: String
    citizen: Citizen
}

# Identity verification types
type IdentityVerification {
    id: ID!
    citizenId: Int! @rename(attribute: "citizen_id")
    status: String!
    notes: String
    documents: [String]
    face_video: String
    reviewedBy: Int @rename(attribute: "reviewed_by")
    reviewedAt: DateTime @rename(attribute: "reviewed_at")
    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
    citizen: Citizen @belongsTo
}

type IdentityVerificationResponse {
    success: Boolean
    message: String
    verification: IdentityVerification
}

enum IdentityVerificationStatus {
    PENDING
    APPROVED
    REJECTED
    NEEDS_MORE_INFO
}

extend type Citizen {
    services: [Service] @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\CitizenQuery@services")
}

enum Gender {
    MALE @enum(value: "Male")
    FEMALE @enum(value: "Female")
}

type PaginatorInfo {
    count: Int!
    currentPage: Int!
    lastPage: Int!
    total: Int!
    hasMorePages: Boolean!
}