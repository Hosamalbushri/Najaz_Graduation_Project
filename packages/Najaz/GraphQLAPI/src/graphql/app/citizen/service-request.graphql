# Citizen ServiceRequest Related APIs
extend type Query @guard(with: ["citizen-api"]) {
    """
    Get all service requests submitted by the authenticated citizen.
    """
    myServiceRequests(
        serviceId: Int
        status: ServiceRequestStatus
        page: Int @rules(apply: ["min:1"])
        limit: Int @rules(apply: ["min:1", "max:50"])
    ): ServiceRequestPaginator
        @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\ServiceRequestQuery@listPaginated")

    """
    Get a specific service request for the authenticated citizen.
    """
    myServiceRequest(id: ID!): ServiceRequest
        @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\ServiceRequestQuery@show")
}

extend type Mutation @guard(with: ["citizen-api"]) {
    """
    Create a new service request for the authenticated citizen.
    """
    createServiceRequest(
        input: CreateServiceRequestInput! @spread
        files: [ServiceRequestFileInput!]
    ): ServiceRequestResponse
        @field(resolver: "Najaz\\GraphQLAPI\\Mutations\\App\\Citizen\\ServiceRequestMutation@store")

    """
    Update a service request (for citizens: only notes and form_data).
    """
    updateServiceRequest(
        id: ID!,
        input: UpdateServiceRequestInput! @spread
        files: [ServiceRequestFileInput!]
    ): ServiceRequestResponse
        @field(resolver: "Najaz\\GraphQLAPI\\Mutations\\App\\Citizen\\ServiceRequestMutation@update")

    """
    Cancel a service request.
    """
    cancelServiceRequest(id: ID!): StatusResponse
        @field(resolver: "Najaz\\GraphQLAPI\\Mutations\\App\\Citizen\\ServiceRequestMutation@cancel")

    """
    Print service request document (PDF) for completed requests.
    Available for requesters and beneficiaries.
    """
    printServiceRequestDocument(id: ID!): FileResponse
        @field(resolver: "Najaz\\GraphQLAPI\\Mutations\\App\\Citizen\\ServiceRequestMutation@printDocument")
}

input CreateServiceRequestInput {
    serviceId: Int! @rename(attribute: "service_id")
    formData: JSON! @rename(attribute: "form_data")
    notes: String
}

input UpdateServiceRequestInput {
    formData: JSON @rename(attribute: "form_data")
    notes: String
}

input ServiceRequestFileInput {
    fieldCode: String! @rename(attribute: "field_code")
    file: Upload!
}

enum ServiceRequestStatus {
    PENDING
    IN_PROGRESS
    COMPLETED
    REJECTED
    CANCELLED
    NEEDS_REVISION
}

type ServiceRequestResponse {
    success: Boolean
    message: String
    request: ServiceRequest
}

type ServiceRequest {
    id: ID!
    incrementId: String @rename(attribute: "increment_id")
    serviceId: Int! @rename(attribute: "service_id")
    citizenId: Int! @rename(attribute: "citizen_id")
    status: String!
    formData: JSON @rename(attribute: "form_data")
    notes: String
    completedAt: DateTime @rename(attribute: "completed_at")
    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
    service: Service @belongsTo
    citizen: Citizen @belongsTo
    beneficiaries: [Citizen!]! @belongsToMany
}

type ServiceRequestPaginator {
    data: [ServiceRequest!]! @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\ServiceRequestQuery@serviceRequestsData")
    paginatorInfo: PaginatorInfo! @field(resolver: "Najaz\\GraphQLAPI\\Queries\\App\\Citizen\\ServiceRequestQuery@serviceRequestsPaginatorInfo")
}

type FileResponse {
    success: Boolean
    filename: String
    base64_content: String
    mime_type: String
}
